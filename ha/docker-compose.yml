x-patroni-environment: &patroni-environment
  PATRONI_SCOPE: marketplace
  PATRONI_NAMESPACE: /db/
  PATRONI_RESTAPI_LISTEN: "0.0.0.0:8008"
  PATRONI_ETCD3_HOSTS: "etcd:2379"
  PATRONI_POSTGRESQL_LISTEN: "0.0.0.0:5432"
  PATRONI_POSTGRESQL_DATA_DIR: "/var/lib/postgresql/data/patroni"

  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD: postgres
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: replicator

  PATRONI_POSTGRESQL_PARAMETERS_WAL_LEVEL: logical
  PATRONI_POSTGRESQL_PARAMETERS_MAX_WAL_SENDERS: 10
  PATRONI_POSTGRESQL_PARAMETERS_MAX_REPLICATION_SLOTS: 10
  PATRONI_POSTGRESQL_PARAMETERS_HOT_STANDBY: "on"
  PATRONI_POSTGRESQL_PGHBA: >
    ["host all all 0.0.0.0/0 scram-sha-256", "host replication replicator 0.0.0.0/0 scram-sha-256"]

x-patroni-base: &patroni-base
  build: .
  environment:
    PATRONI_CONFIGURATION: "/etc/patroni/patroni.yml" 
    PATRONI_SCOPE: marketplace
    PATRONI_NAMESPACE: /db/
    PATRONI_RESTAPI_LISTEN: "0.0.0.0:8008"
    PATRONI_ETCD3_HOSTS: "etcd:2379"
    PATRONI_POSTGRESQL_LISTEN: "0.0.0.0:5432"
    PATRONI_POSTGRESQL_DATA_DIR: "/var/lib/postgresql/data/patroni"

    PATRONI_SUPERUSER_USERNAME: postgres
    PATRONI_SUPERUSER_PASSWORD: postgres
    PATRONI_REPLICATION_USERNAME: replicator
    PATRONI_REPLICATION_PASSWORD: replicator

    PATRONI_POSTGRESQL_PARAMETERS_WAL_LEVEL: logical
    PATRONI_POSTGRESQL_PARAMETERS_MAX_WAL_SENDERS: 10
    PATRONI_POSTGRESQL_PARAMETERS_MAX_REPLICATION_SLOTS: 10
    PATRONI_POSTGRESQL_PARAMETERS_HOT_STANDBY: "on"
    PATRONI_POSTGRESQL_PGHBA: >
      ["host all all 0.0.0.0/0 scram-sha-256", "host replication replicator 0.0.0.0/0 scram-sha-256"]

  depends_on:
    etcd:
      condition: service_healthy
  networks:
    - ha_net

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd
    command: >
      /usr/local/bin/etcd
      --name node1
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://etcd:2380
      --initial-cluster node1=http://etcd:2380
      --initial-cluster-state new
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ha_net

  patroni-1:
    <<: *patroni-base
    container_name: patroni-1
    environment:
      PATRONI_NAME: patroni-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: "patroni-1:8008"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "patroni-1:5432"
    volumes:
      - pgdata_1:/var/lib/postgresql/data/patroni
      - ./patroni.yml:/etc/patroni/patroni.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: ["patroni", "/etc/patroni/patroni.yml"]

  patroni-2:
    <<: *patroni-base
    container_name: patroni-2
    environment:
      PATRONI_NAME: patroni-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: "patroni-2:8008"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "patroni-2:5432"
    volumes:
      - pgdata_2:/var/lib/postgresql/data/patroni
      - ./patroni.yml:/etc/patroni/patroni.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: ["patroni", "/etc/patroni/patroni.yml"]

  patroni-3:
    <<: *patroni-base
    container_name: patroni-3
    environment:
      PATRONI_NAME: patroni-3
      PATRONI_RESTAPI_CONNECT_ADDRESS: "patroni-3:8008"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "patroni-3:5432"
    volumes:
      - pgdata_3:/var/lib/postgresql/data/patroni
      - ./patroni.yml:/etc/patroni/patroni.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: ["patroni", "/etc/patroni/patroni.yml"]

  haproxy:
    depends_on:
      etcd:
        condition: service_started
      patroni-1:
        condition: service_healthy
      patroni-2:
        condition: service_healthy
      patroni-3:
        condition: service_healthy
    image: haproxy:latest
    container_name: haproxy
    ports:
      - "7001:7000"
      - "5001:5001"
      - "5000:5000"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - ha_net

  migrator:
    image: postgres:17
    container_name: migrator
    depends_on:
      haproxy:
        condition: service_started
    environment:
      PGHOST: haproxy
      PGPORT: 5000
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ../migrations:/migrations:ro
      - ../cohort_analysis:/cohort_analysis:ro
    command: >
      bash -c "
      until pg_isready; do sleep 1; done

      psql -f /migrations/000_create_dbs.sql
      psql -d user_service_db -f /migrations/001_user_service_db.sql
      psql -d order_service_db -f /migrations/002_order_service_db.sql
      psql -d logistics_service_db -f /migrations/003_logistics_service_db.sql

      psql -d order_service_db -f /cohort_analysis/cohort_view.sql
      "

  dwh-postgres:
    image: postgres:17
    container_name: dwh-postgres
    environment:
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: dwh_password
      POSTGRES_DB: dwh
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432" 
    volumes:
      - dwh_data:/var/lib/postgresql/data
      - ../dwh/ddl:/docker-entrypoint-initdb.d:ro
    networks:
      - ha_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh_user -d dwh"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ha_net
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.0.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL      
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ha_net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  debezium:
    image: debezium/connect:2.5
    container_name: debezium
    depends_on:
      kafka:
        condition: service_healthy
      haproxy:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      PLUGIN_PATH: /kafka/connect
      LOG_LEVEL: INFO
    volumes:
      - ../debezium/connectors:/kafka/connect/debezium-connectors:ro
    networks:
      - ha_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  debezium-setup:
    image: curlimages/curl:latest
    container_name: debezium-setup
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ../debezium/scripts:/scripts:ro
      - ../debezium/connectors:/connectors:ro
    command: >
      sh -c "
      sleep 10 &&
      sh ../debezium/scripts/register-connectors.sh &&
      echo 'All connectors registered!' &&
      tail -f /dev/null
      "
    networks:
      - ha_net

  dmp:
    build: ../dmp
    container_name: dmp
    depends_on:
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy
      dwh-postgres:
        condition: service_healthy
    environment:
      PG_DESTINATION: "postgresql://dwh_user:dwh_password@dwh-postgres:5432/dwh"
      KAFKA_BOOTSTRAP: "kafka:9092"
      CONFIG_PATH: "/app/config/ddl_config.yaml"
      KAFKA_GROUP_ID: "dmp_group"
      BATCH_SIZE: 300
    volumes:
      - ../dwh/docs:/app/config:ro
    networks:
      - ha_net
    restart:
      unless-stopped

volumes:
  pgdata_1:
  pgdata_2:
  pgdata_3:
  dwh_data:
  kafka_data:
  zookeeper_data:

networks:
  ha_net: